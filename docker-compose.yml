services:
  postgres:
    image: postgres:16-alpine
    container_name: prodentis-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prodentis
    ports:
      - '5432:5432'
    volumes:
      - prodentis_pg:/var/lib/postgresql/data

volumes:
  prodentis_pg:
